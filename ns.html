        .top-top h1 {

            font-size: 25px;
            font-weight: 700;

        }

            cursor: pointer;
        }

        .form {
            display: block;
            width: 340px;
            margin: 0 auto 20px;
        }

        input {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        input[type='text'] {
            display: block;
            outline: none;
            width: 334px;
            height: 34px;
            line-height: 40px;
            border: 2px solid #ccc;
            margin: 0 0 15px;
            font-size: 15px;
            text-indent: 15px;
        }

        input[type='text']:focus {
            border: 1px solid #256672;
        }

        input[type='password'] {
            display: block;
            outline: none;
            width: 334px;
            height: 34px;
            line-height: 40px;
            border: 2px solid #ccc;
            margin: 0 0 15px;
            font-size: 15px;
            text-indent: 15px;
        }

        input[type='password']:focus {
            border: 1px solid #256672;
        }

        input[type='submit'] {
            display: block;
            width: 340px;
            height: 40px;
            line-height: 40px;
            background: #256672;
            text-align: center;
            color: #fff;
            border: 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }





        #submit:hover {
            background: #2d7e8c
        }

        #err {
            height: 30px;
            color: #DA4F49;
            font-size: 14px;
            text-align: center;
        }

        a.pw {
            display: block;
            text-align: center;
            margin: 0 0 30px;
            color: #256672;
            font-size: 13px;
            text-decoration: none;
        }

        a.pw:hover {
            text-decoration: underline;
        }

        a.moble {
            display: block;
            text-align: center;
            margin: 0 0 5px;
            color: #256672;
            font-size: 13px;
            text-decoration: none;
        }

        a.moble:hover {
            text-decoration: underline;
        }

        .top-bottom {
            display: block;
            width: 100%;
            background: #f0f0f0;
            color: #828282;
        }

        .top-bottom p {
            display: block;
            margin: 40px;
            line-height: 20px;
            font-size: 14px;
            text-align: center;
            padding-top: 30px;

            text-align: center;
        }

        }

        .bottom ul li a {
            color: #6c6c6c;
            text-decoration: none;
        }

        .bottom p {
            text-align: center;
            margin: 10px auto 0;
        }

        @media screen and (max-width: 400px) {
            .main {
                margin: 10px 0 50px;
                min-width: 300px;
            }

            .card {
                width: 95%;
            }

            .top h1,
            .top span {
                width: 80%;
                margin: auto;
            }

            .form {
                width: 80%;
                margin: 0 auto 20px;
            }

            input[type='text'],
            input[type='submit'],
            input[type='password'] {
                width: 100%;
                box-sizing: border-box;
                -moz-box-sizing: border-box;
                -webkit-box-sizing: border-box;
            }

            .top span {
                font-size: 13px;
                line-height: 18px;
            }

            .bottom p {
                margin: 20px;
                font-size: 12px;
                line-height: 18px;

            #err {
